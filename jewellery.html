<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu</title>
  <style>
   
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }


   


    p {
      text-align: center;
      font-size: 5vw;
      font-weight: lighter;
      margin-top: 5vh;
    }


    img{
        transition: filter 0.3s ease;
    }




    #arrivalContainer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 90%;
      margin: 0 auto;
    }


    #big {
      grid-column: 1 / 3;
      grid-row: 1 / 3;
      width: 100%;
      height: auto;
      object-fit: contain;
      background-color: #f3f3f3;
      border-radius: 6px;
    }


   
    #arrivalContainer img:not(#big) {
      width: 100%;
      height: auto;
      object-fit: contain;
      background-color: #f3f3f3;
      border-radius: 6px;
      display: block;
      margin-bottom: 7vh;
    }


   
    .oggyy {
      background-color: rgb(149, 148, 148);
      color: black;
      font-size: 48px;
      font-weight: lighter;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      padding: 3%;
      text-align: center;
      margin: 90px auto;
      width: fit-content;
      border-radius: 10px;
      transition: 0.3s;
    }


    .oggyy:hover {
      background-color: #222;
      color: white;
      cursor: pointer;
    }


   
    @media (max-width: 900px) {
      #arrivalContainer {
        grid-template-columns: repeat(2, 1fr);
      }
    }


    @media (max-width: 600px) {
      #arrivalContainer {
        grid-template-columns: 1fr;
      }
      #big {
        grid-column: auto;
        grid-row: auto;
      }
    }


#Header{
     background-color: rgba(255, 255, 255, 0.658);
     position: sticky;
     top: 0;
     height: 10vh;
     z-index: 100;
    }
 #MenuIcon{
        height: auto;
        width: 1.65vw;
        margin-left: 1.7vw;
        margin-top: 1.5vw;
        display: inline;
    }
#menu{
  color: rgb(0, 0, 0);
     
      margin-top: 0vw;
     
      padding: 15px;
      font-size: 1vw;
     font-weight: lighter;
     display: inline;
}


 
     
     


img:hover {
  filter: brightness(80%);
}




#SmllTxt{
  text-align: center;
  font-size: 0.7vw;
  margin-bottom: 10vh;
}






















/* SIDE MENU */
#sideMenu {
  position: fixed;
  top: 0;
  left: -250px; /* hidden off-screen */
  width: 250px;
  height: 100vh;
  background-color: white;
  box-shadow: 3px 0 10px rgba(0,0,0,0.2);
  padding-top: 20px;
  transition: left 0.3s ease;
  z-index: 1000;
}


#sideMenu.show {
  left: 0; /* slide in */
}


#sideMenu a {
  display: block;
  padding: 15px 20px;
  font-size: 20px;
  color: black;
  text-decoration: none;
}


#sideMenu a:hover {
  background-color: #f3f3f3;
}


/* Menu button */
#MenuButton {
  font-size: 30px;
  margin-left: 15px;
  margin-top: 15px;
  cursor: pointer;
  user-select: none;
}












span{
  font-size: 2.5vh;
  margin-left: 0.7vw;
}






  </style>
</head>

 <script>
  function toggleMenu() {
    document.getElementById("sideMenu").classList.toggle("show");
  }
</script>
