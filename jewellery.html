<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jewellery</title>

<style>

/* BODY */
body {
  margin: 0;
  padding: 0;
  background-color: #ffffff;
  font-family: Arial, sans-serif;
}

/* HEADER */
#Header {
  background-color: rgba(255, 255, 255, 0.9);
  position: sticky;
  top: 0;
  height: 10vh;
  display: flex;
  align-items: center;
  z-index: 1000;
  box-shadow: 0 2px 6px rgba(0,0,0,0.07);
}

#MenuButton {
  font-size: 30px;
  margin-left: 15px;
  cursor: pointer;
  user-select: none;
}

#MenuButton span {
  font-size: 18px;
  margin-left: 8px;
}

/* TITLE */
p {
  text-align: center;
  font-size: 5vw;
  font-weight: lighter;
  margin-top: 5vh;
}

#SmllTxt {
  text-align: center;
  font-size: 1.2vw;
  margin-bottom: 4vh;
}

/* GRID */
#arrivalContainer {
  width: 90%;
  display: grid;
  margin: 0 auto;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.bigItem {
  grid-column: 1 / 3;
  grid-row: 1 / 3;
}

#arrivalContainer img {
  width: 100%;
  cursor: pointer;
  background-color: #f3f3f3;
  object-fit: contain;
  border-radius: 6px;
  transition: 0.3s;
}

#arrivalContainer img:hover {
  filter: brightness(80%);
}

/* RESPONSIVE */
@media (max-width: 900px) {
  #arrivalContainer { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  #arrivalContainer { grid-template-columns: 1fr; }
  .bigItem { grid-column: auto; grid-row: auto; }
}

/* SIDE MENU */
#sideMenu {
  position: fixed;
  top: 0; left: -250px;
  width: 250px;
  height: 100vh;
  background: white;
  box-shadow: 3px 0 10px rgba(0,0,0,0.2);
  transition: 0.3s;
  padding-top: 20px;
  z-index: 2000;
}
#sideMenu.show { left: 0; }
#sideMenu a {
  display: block;
  padding: 15px 20px;
  font-size: 20px;
  color: black;
  text-decoration: none;
}
#sideMenu a:hover { background: #f3f3f3; }

/* PRODUCT MODAL */
#productModal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  align-items: center;
  justify-content: center;
  z-index: 5000;
}

#modalBox {
  background: white;
  padding: 20px;
  width: 80%;
  max-width: 430px;
  border-radius: 10px;
  position: relative;
  text-align: center;
  animation: fadeIn .25s ease;
}

#modalImg {
  width: 100%;
  border-radius: 10px;
}

.close {
  position: absolute;
  top: 8px;
  right: 15px;
  font-size: 35px;
  cursor: pointer;
}

@keyframes fadeIn {
  from { opacity:0; transform:scale(.95); }
  to { opacity:1; transform:scale(1); }
}

</style>
</head>

<body>

<!-- HEADER -->
<div id="Header">
  <div id="MenuButton" onclick="toggleMenu()">☰ <span>Menu</span></div>
</div>

<!-- SIDE MENU -->
<div id="sideMenu">
  <a href="index.html">Home</a>
  <a href="new-arrival.html">NEW ARRIVAL</a>
  <a href="men.html">MEN'S CLOTHING</a>
  <a href="women.html">WOMEN'S CLOTHING</a>
  <a href="bridal-boutique.html">BRIDAL BOUTIQUE</a>
  <a href="jewellery.html">JEWELLERY</a>
  <a href="gifts.html">GIFTS</a>
</div>

<script>
function toggleMenu() {
  document.getElementById("sideMenu").classList.toggle("show");
}
</script>

<!-- TITLE -->
<p>Jewellery</p>
<p id="SmllTxt">Vivienne Westwood hand-crafted jewellery — brooches, pins, and hair accessories.</p>

<!-- PRODUCT GRID -->
<div id="arrivalContainer">

  <!-- Big Items -->
  <img class="bigItem product" src="https://www.viviennewestwood.com/dw/image/...">

  <img class="bigItem product" src="https://www.viviennewestwood.com/dw/image/...">

  <!-- Regular Items -->
  <img class="product" src="assets/j1.jpg">
  <img class="product" src="assets/j2.jpg">
  <img class="product" src="assets/j3.jpg">
  <img class="product" src="assets/j4.jpg">
  <img class="product" src="assets/j5.jpg">
  <img class="product" src="assets/j6.jpg">
  <img class="product" src="assets/j7.jpg">
  <img class="product" src="assets/j8.jpg">
  <img class="product" src="assets/j9.jpg">
  <img class="product" src="assets/j10.jpg">

</div>

<!-- PRODUCT MODAL -->
<div id="productModal">
  <div id="modalBox">
    <span class="close">&times;</span>
    <img id="modalImg">
    <h2 id="modalName"></h2>
    <p id="modalPrice" style="font-size:22px;font-weight:bold;"></p>
    <p id="modalInfo" style="font-size:14px;color:#444;"></p>
  </div>
</div>

<script>

const products = document.querySelectorAll(".product");

products.forEach(img => {
  img.addEventListener("click", () => {

    document.getElementById("modalImg").src = img.src;

    document.getElementById("modalName").textContent = "Jewellery Item";
    document.getElementById("modalPrice").textContent = "$ — Price";
    document.getElementById("modalInfo").textContent = "High-quality hand-crafted accessory.";

    document.getElementById("productModal").style.display = "flex";
  });
});

document.querySelector(".close").onclick = () => {
  document.getElementById("productModal").style.display = "none";
};

window.onclick = (event) => {
  if (event.target === document.getElementById("productModal")) {
    document.getElementById("productModal").style.display = "none";
  }
};
</script>

</body>
</html>
