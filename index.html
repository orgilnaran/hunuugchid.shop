  <title>Menu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
    }

    /* ---------------- HEADER ---------------- */
    #Header {
      position: sticky;
      top: 0;
      background: white;
      z-index: 2000;
      padding: 15px 20px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    #MenuButton {
      font-size: 28px;
      cursor: pointer;
      user-select: none;
    }

    /* ---------------- SIDE MENU ---------------- */
    #sideMenu {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100vh;
      background: #fff;
      box-shadow: 3px 0 12px rgba(0, 0, 0, 0.2);
      transition: left 0.35s ease;
      padding-top: 60px;
      z-index: 3000;
    }

    #sideMenu.show {
      left: 0;
    }

    #sideMenu a {
      display: block;
      padding: 18px 25px;
      font-size: 20px;
      text-decoration: none;
      color: black;
      transition: background 0.2s;
    }

    #sideMenu a:hover {
      background: #f0f0f0;
    }

    /* ---------------- TITLES ---------------- */
    .section-title {
      font-size: 42px;
      margin: 50px 20px 10px;
      font-weight: bold;
    }

    /* ---------------- PRODUCT SCROLLER ---------------- */
    #product {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding: 20px;
      scroll-snap-type: x mandatory;
    }

    #product img {
      width: 260px;
      border-radius: 8px;
      flex-shrink: 0;
      scroll-snap-align: center;
    }

    /* ---------------- FULL WIDTH IMAGE SECTIONS ---------------- */
    .full-section {
      position: relative;
      width: 100%;
      height: 110vh;
      background: rgba(118, 114, 151, 1);
      color: white;
      margin-top: 80px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 10vh 4vw;
      font-size: 48px;
      font-weight: bold;
      text-align: right;
    }

    .full-section img {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 50%;
      object-fit: cover;
    }

    /* ---------------- GRID IMAGES ---------------- */
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
      justify-content: center;
    }

    .grid img {
      width: 240px;
      border-radius: 8px;
    }

    /* ---------------- GENDER SECTION ---------------- */
    .side-by-side {
      display: flex;
      justify-content: space-between;
      padding: 40px;
      margin-top: 80px;
      background: rgba(118, 114, 151, 1);
      gap: 20px;
    }

    .gender-box {
      position: relative;
      width: 48%;
    }

    .gender-box img {
      width: 100%;
      border-radius: 10px;
      object-fit: cover;
    }

    .gender-label {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0,0,0,0.55);
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 32px;
      color: white;
      font-weight: bold;
      letter-spacing: 2px;
    }

    /* ---------------- RESPONSIVE ---------------- */
    @media (max-width: 900px) {
      .full-section {
        height: 320px;
        font-size: 32px;
        padding: 20px;
        justify-content: center;
        text-align: center;
      }

      .full-section img {
        width: 100%;
        opacity: 0.35;
      }

      .side-by-side {
        flex-direction: column;
        padding: 20px;
      }

      .gender-box {
        width: 100%;
      }

      .section-title {
        font-size: 34px;
      }
    }



    .lai{
        color: #ddd;
    }


.gender-a{

     display: inline;
     z-index: 10;
}
