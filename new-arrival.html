<!DOCTYPE html>

  <meta charset="UTF-8" />

  <title>Menu</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }

    p {
      text-align: center;
      font-size: 5vw;
      font-weight: lighter;
      margin-top: 5vh;
    }

    img {
      transition: filter 0.3s ease;
    }

    #arrivalContainer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 90%;
      margin: 0 auto;
    }

    #big {
      grid-column: 1 / 3;
      grid-row: 1 / 3;
      width: 100%;
      height: auto;
      object-fit: contain;
      background-color: #f3f3f3;
      border-radius: 6px;
    }

    #arrivalContainer img:not(#big) {
      width: 100%;
      height: auto;
      object-fit: contain;
      background-color: #f3f3f3;
      border-radius: 6px;
      display: block;
      margin-bottom: 7vh;
    }

    img:hover {
      filter: brightness(80%);
    }

    #SmllTxt {
      text-align: center;
      font-size: 1.7vw;
      margin-bottom: 10vh;
    }

    /* SIDE MENU */
    #sideMenu {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100vh;
      background-color: white;
      box-shadow: 3px 0 10px rgba(0,0,0,0.2);
      padding-top: 20px;
      transition: left 0.3s ease;
      z-index: 1000;
    }

    #sideMenu.show {
      left: 0;
    }

    #sideMenu a {
      display: block;
      padding: 15px 20px;
      font-size: 20px;
      color: black;
      text-decoration: none;
    }

    #sideMenu a:hover {
      background-color: #f3f3f3;
    }

    #MenuButton {
      font-size: 30px;
      margin-left: 15px;
      margin-top: 15px;
      cursor: pointer;
      user-select: none;
    }

    #Header {
      background-color: rgba(255, 255, 255, 0.658);
      position: sticky;
      top: 0;
      height: 10vh;
      z-index: 100;
    }

    span {
      font-size: 2.5vh;
      margin-left: 0.7vw;
    }

    @media (max-width: 900px) {
      #arrivalContainer {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      #arrivalContainer {
        grid-template-columns: 1fr;
      }
      #big {
        grid-column: auto;
        grid-row: auto;
      }
    }

    /* PRODUCT MODAL */
    #productModal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    #modalBox {
      background: white;
      padding: 20px;
      width: 80%;
      max-width: 400px;
      border-radius: 10px;
      position: relative;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }

    #modalImg {
      width: 100%;
      border-radius: 6px;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 30px;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

  <!-- PRODUCT MODAL -->

      <span class="close">&times;</span>

      <p id="modalPrice" style="font-weight:bold;"></p>
      <p id="modalInfo"></p>
    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    window.onload = function () {

      // Toggle side menu
      window.toggleMenu = function () {
        document.getElementById("sideMenu").classList.toggle("show");
      };

      // Open product modal
      window.openProduct = function (el) {
        const img = el.querySelector("img").src;
        const name = el.dataset.name;
        const price = el.dataset.price;
        const info = el.dataset.info;

        document.getElementById("modalImg").src = img;
        document.getElementById("modalName").innerText = name;
        document.getElementById("modalPrice").innerText = price;
        document.getElementById("modalInfo").innerText = info;

        document.getElementById("productModal").style.display = "flex";
      };

      // Close modal button
      document.querySelector(".close").onclick = function () {
        document.getElementById("productModal").style.display = "none";
      };

      // Close clicking outside
      window.onclick = function (e) {
        if (e.target === document.getElementById("productModal")) {
          document.getElementById("productModal").style.display = "none";
        }
      };
    };
  </script>
